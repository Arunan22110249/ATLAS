# Prometheus configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'atlas'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'atlas-api'
    static_configs:
      - targets: ['atlas-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'qdrant'
    static_configs:
      - targets: ['atlas-qdrant:6333']

  - job_name: 'postgres'
    static_configs:
      - targets: ['atlas-postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['atlas-redis:6379']

  - job_name: 'kafka'
    static_configs:
      - targets: ['atlas-kafka:9092']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'
